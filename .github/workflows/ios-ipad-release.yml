# 编全优化的 iPad Release 包: 只在 ci/ios-ipad-release 分支上跑, 不进 main。
# Release 链接做全程序分析, 去虚拟化分析在 11g 堆上会爆; 这里全部阶段照做, 编译器单独一个进程给 24g 堆,
# 跑在 Intel 机器 (14 GB) 上, 超出物理内存的部分靠 macOS 交换区 (10-25 实测链接 2 小时 38 分, GC 后存活最高约 14.9 GB)。
# 编译器的 GC 日志写到 logs/gc.log, 每分钟记一次 swap 与各 Java 进程常驻内存到 logs/mem.log。
name: iOS iPad Release IPA

on:
  push:
    branches:
      - 'ci/ios-ipad-release'

concurrency:
  group: ios-ipad-release
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: 'iOS Release ${{ matrix.name }} (${{ matrix.runner }})'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # kn_jvm = Kotlin/Native 编译器单独进程的 JVM 参数; kn_args 加到 framework 的编译参数里 (空 = 不加)
          - name: 'full'
            runner: 'macos-15-intel'
            variant: 'Release'
            dir: 'release'
            compile_heap: '6g'
            link_heap: '1g'
            kn_jvm: '-Xmx24g -XX:+UseParallelGC'
            kn_args: ''
            workers: '4'
            jbr: 'jbrsdk_jcef-21.0.11-osx-x64-b1163.116.tar.gz'
    steps:
      - uses: actions/checkout@v4

      - name: 机器与 Xcode
        run: |
          sw_vers
          echo "arch=$(uname -m) cpu=$(sysctl -n hw.ncpu) mem=$(( $(sysctl -n hw.memsize) / 1073741824 ))GB"
          df -h /
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "选用 $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          pod --version
          # 盘不够时删掉没选用的 Xcode (有的是指向同一份的软链, 只删链接)
          FREE_GB=$(df -g / | awk 'NR==2 {print $4}')
          if [ "$FREE_GB" -lt 30 ]; then
            XREAL=$(cd "$XCODE" && pwd -P)
            for x in /Applications/Xcode_*.app; do
              if [ -L "$x" ]; then sudo rm -f "$x"
              elif [ "$(cd "$x" && pwd -P)" != "$XREAL" ]; then sudo rm -rf "$x"; fi
            done
            df -h /
          fi

      # 构建脚本的工具链要 JetBrains Runtime (vendor = jetbrains), 与 build.yml 用同一版
      - name: JBR 21
        run: |
          BASE_URL="https://cache-redirector.jetbrains.com/intellij-jbr/${{ matrix.jbr }}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jbr.tar.gz" "$BASE_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jbr.checksum" "$BASE_URL.checksum"
          echo "$(awk '{print $1}' "$RUNNER_TEMP/jbr.checksum")  $RUNNER_TEMP/jbr.tar.gz" | shasum -a 512 -c -
          mkdir -p "$RUNNER_TEMP/jbr"
          tar -xzf "$RUNNER_TEMP/jbr.tar.gz" -C "$RUNNER_TEMP/jbr"
          JAVA_BIN=$(find "$RUNNER_TEMP/jbr" -path '*/bin/java' -type f | head -1)
          JBR_HOME=$(dirname "$(dirname "$JAVA_BIN")")
          "$JBR_HOME/bin/java" -version
          echo "JAVA_HOME=$JBR_HOME" >> "$GITHUB_ENV"
          echo "$JBR_HOME/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建参数
        run: |
          rm -f local.properties
          cat > local.properties <<'EOF'
          ani.enable.ios=true
          ani.build.framework=true
          kotlin.native.ignoreDisabledTargets=true
          jvm.toolchain.version=21
          ani.android.abis=arm64-v8a
          ani.dandanplay.app.id=${{ secrets.DANDANPLAY_APP_ID }}
          ani.dandanplay.app.secret=${{ secrets.DANDANPLAY_APP_SECRET }}
          ani.tmdb.api.token=${{ secrets.TMDB_API_TOKEN }}
          ani.bangumi.oauth.client.id=${{ secrets.BANGUMI_OAUTH_CLIENT_ID }}
          ani.bangumi.oauth.client.secret=${{ secrets.BANGUMI_OAUTH_CLIENT_SECRET }}
          ani.bangumi.oauth.relay.client.id=${{ secrets.BANGUMI_OAUTH_RELAY_CLIENT_ID }}
          ani.bangumi.oauth.relay.client.secret=${{ secrets.BANGUMI_OAUTH_RELAY_CLIENT_SECRET }}
          EOF
          mkdir -p ~/.gradle logs
          cat >> ~/.gradle/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx${{ matrix.compile_heap }} -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=${{ matrix.workers }}
          org.gradle.java.installations.paths=$JAVA_HOME
          kotlin.compiler.execution.strategy=in-process
          EOF
          cat ~/.gradle/gradle.properties
          if [ -n "${{ matrix.kn_args }}" ]; then
            perl -pi -e 's/^(\s*)baseName = "application"$/$&\n$1freeCompilerArgs += "${{ matrix.kn_args }}"/' app/shared/application/build.gradle.kts
            grep -n -B2 -A2 'freeCompilerArgs += ' app/shared/application/build.gradle.kts
            grep -q -- '${{ matrix.kn_args }}' app/shared/application/build.gradle.kts
          fi

      - name: 编译 Kotlin (iosArm64, 各模块)
        id: compile
        run: ./gradlew :app:shared:application:compileKotlinIosArm64 --continue --stacktrace 2>&1 | tee logs/1-compile.log

      - name: 链接 framework (${{ matrix.variant }})
        id: link
        run: |
          # 编译用的守护进程还占着大堆, 先停掉再按链接的配置起
          ./gradlew --stop
          sed -i '' '/^org.gradle.jvmargs=/d' ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx${{ matrix.link_heap }} -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          if [ -n "${{ matrix.kn_jvm }}" ]; then
            echo "kotlin.native.disableCompilerDaemon=true" >> ~/.gradle/gradle.properties
            # GC 日志写到 logs/gc.log (路径要在这里用运行时的 GITHUB_WORKSPACE 拼, 矩阵里取不到)
            echo "kotlin.native.jvmArgs=${{ matrix.kn_jvm }} -Xlog:gc:file=$GITHUB_WORKSPACE/logs/gc.log:uptime" >> ~/.gradle/gradle.properties
          fi
          cat ~/.gradle/gradle.properties
          # 每两分钟记一次 swap 与各 Java 进程的常驻内存, 失败时看是谁吃满的
          (
            while true; do
              echo "== $(date '+%H:%M:%S') swap: $(sysctl -n vm.swapusage)"
              ps -axo rss=,command= | grep '[j]ava' | while read -r rss cmd; do
                echo "  $((rss / 1024)) MB $(echo "$cmd" | grep -oE -- '-Xmx[0-9]+[a-zA-Z]' | head -1) $(echo "$cmd" | grep -oE 'GradleDaemon|org\.jetbrains\.kotlin\.[A-Za-z.]+' | head -1)"
              done
              sleep 60
            done
          ) > logs/mem.log 2>&1 &
          ./gradlew :app:shared:application:linkPod${{ matrix.variant }}FrameworkIosArm64 --stacktrace 2>&1 | tee logs/2-link.log

      - name: 出未签名的 ${{ matrix.variant }} IPA
        id: ipa
        run: |
          ./gradlew :app:shared:application:generateDummyFramework --stacktrace 2>&1 | tee logs/3-ipa.log
          ./gradlew :app:ios:podInstall --stacktrace 2>&1 | tee -a logs/3-ipa.log
          ./gradlew :app:ios:patchInfoPlist --stacktrace 2>&1 | tee -a logs/3-ipa.log
          ./gradlew :app:ios:build${{ matrix.variant }}Ipa --stacktrace 2>&1 | tee -a logs/3-ipa.log
          ls -la app/ios/build/archives/${{ matrix.dir }}/

      - name: 上传 IPA
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 'ani-ios-release-${{ matrix.name }}'
          path: app/ios/build/archives/${{ matrix.dir }}/Animeko.ipa
          if-no-files-found: error

      - name: 错误汇总
        if: always()
        run: |
          ROOT="$GITHUB_WORKSPACE/"
          {
            echo "## ${{ matrix.name }} (${{ matrix.runner }})"
            echo "compile=${{ steps.compile.outcome }} link=${{ steps.link.outcome }} ipa=${{ steps.ipa.outcome }}"
            echo
            echo '```'
            cat logs/*.log 2>/dev/null | grep -E '^e: ' | sed "s#file://$ROOT##; s#$ROOT##" | sort -u | head -400 || true
            echo '```'
            echo '```'
            cat logs/*.log 2>/dev/null | grep -E -A8 'What went wrong' | head -200 || true
            echo '```'
            echo '```'
            tail -30 logs/mem.log 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > logs/summary.md

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'ios-logs-${{ matrix.name }}'
          path: logs/
          if-no-files-found: ignore
