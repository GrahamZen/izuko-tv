<svg xmlns="http://www.w3.org/2000/svg" width="780" height="644" viewBox="0 0 780 644" fill="none" role="img" aria-labelledby="title description">
  <title id="title">播放器遥控器指南</title>
  <desc id="description">上键打开选源面板；确认键播放或暂停，按住以默认 2.5 倍速播放，松开恢复；左右键快退或快进 5 秒，按住或连按可预览进度，确认跳转、返回取消；下键显示进度条和控制按钮；返回键逐层收起，最后退出播放，长按直接回到画面；播放键播放或暂停，拖动进度时从预览位置播放；快退、快进键切换上一集、下一集。</desc>
  <defs>
    <linearGradient id="remote-body" x1="72" y1="144" x2="218" y2="524" gradientUnits="userSpaceOnUse">
      <stop stop-color="#424452"/><stop offset=".48" stop-color="#282936"/><stop offset="1" stop-color="#1c1d28"/>
    </linearGradient>
    <linearGradient id="remote-rim" x1="82" y1="148" x2="205" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#828394"/><stop offset=".42" stop-color="#454654"/><stop offset="1" stop-color="#333440"/>
    </linearGradient>
    <linearGradient id="direction-pad" x1="104" y1="223" x2="178" y2="323" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555666"/><stop offset="1" stop-color="#383946"/>
    </linearGradient>
    <linearGradient id="confirm-key" x1="118" y1="250" x2="162" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2d9ff"/><stop offset="1" stop-color="#b5a3ed"/>
    </linearGradient>
    <filter id="remote-shadow" x="-40%" y="-15%" width="180%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#26203c" flood-opacity=".2"/>
    </filter>
    <clipPath id="stage-clip"><rect x="24" y="112" width="230" height="466" rx="28"/></clipPath>
    <g id="up"><path d="m-5 3 5-6 5 6"/></g>
    <g id="down"><path d="m-5-3 5 6 5-6"/></g>
    <g id="left-right"><path d="m-6-4-4 4 4 4m12-8 4 4-4 4"/></g>
    <g id="back"><path d="M-4-5-9 0l5 5M-9 0H3a6 6 0 0 1 0 12" transform="translate(0 -3)"/></g>
    <g id="play-pause"><path d="m-8-7 9 7-9 7ZM5-6V6m5-12V6"/></g>
    <g id="previous-next"><path d="M-9-5-15 0-9 5ZM-2-5-8 0-2 5ZM2-5 8 0 2 5ZM9-5 15 0 9 5Z" fill="currentColor" stroke="none"/></g>
  </defs>
  <style>
    text { font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .canvas { fill: #fcfbfe; stroke: #e7e4ee; }
    .stage { fill: #f0edf7; }
    .halo { fill: #e6e0f3; }
    .halo-inner { fill: #ece7f7; }
    .heading { fill: #282534; font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
    .eyebrow { fill: #807492; font-size: 10px; font-weight: 600; letter-spacing: 2px; }
    .subheading { fill: #746e80; font-size: 13px; }
    .label { fill: #302b3c; font-size: 17px; font-weight: 600; }
    .detail { fill: #716a7d; font-size: 14px; }
    .key-name { fill: #7a689c; font-size: 12px; font-weight: 500; }
    .chip { fill: #eee8fa; }
    .chip-icon { color: #7860aa; stroke: #7860aa; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .divider { stroke: #eae6f0; }
    .footer { fill: #f2eff8; }
    .footer-text { fill: #766b89; font-size: 12px; }
    .remote-icon { stroke: #e7e5ef; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .remote-small { fill: #aaa7ba; font-size: 9px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1c1b23; stroke: #37323f; }
      .stage { fill: #292532; }
      .halo { fill: #373044; }
      .halo-inner { fill: #302a3c; }
      .heading, .label { fill: #eee8f6; }
      .eyebrow { fill: #ac9cbe; }
      .subheading, .detail { fill: #b6acc4; }
      .key-name { fill: #baa6d6; }
      .chip { fill: #383044; }
      .chip-icon { color: #c6afea; stroke: #c6afea; }
      .divider { stroke: #36303f; }
      .footer { fill: #2a2533; }
      .footer-text { fill: #b9accb; }
    }
  </style>

  <rect class="canvas" x=".5" y=".5" width="779" height="643" rx="24"/>
  <text class="eyebrow" x="28" y="31">IZUKO TV / PLAYER</text>
  <text class="heading" x="28" y="66">播放器遥控器指南</text>
  <text class="subheading" x="29" y="90">选源、快进、倍速，几个按键就够了。</text>
  <rect class="chip" x="680" y="35" width="72" height="28" rx="14"/>
  <circle cx="696" cy="49" r="3" fill="#a18acb"/>
  <text class="key-name" x="707" y="53">播放中</text>

  <!-- 遥控器：方向环、确认键与独立媒体键。 -->
  <g clip-path="url(#stage-clip)">
    <rect class="stage" x="24" y="112" width="230" height="466" rx="28"/>
    <circle class="halo" cx="139" cy="288" r="152"/>
    <circle class="halo-inner" cx="139" cy="288" r="119"/>
    <ellipse cx="140" cy="540" rx="62" ry="8" fill="#32283f" opacity=".09"/>
  </g>
  <rect x="68" y="140" width="142" height="394" rx="43" fill="url(#remote-body)" stroke="url(#remote-rim)" stroke-width="1.5" filter="url(#remote-shadow)"/>
  <path d="M80 204v-18a34 34 0 0 1 34-34h42" stroke="#b8b7c9" stroke-opacity=".14" stroke-width="2" stroke-linecap="round"/>
  <rect x="128" y="159" width="22" height="4" rx="2" fill="#14151e"/>
  <circle cx="139" cy="182" r="2" fill="#bbabd9"/>
  <text x="139" y="203" text-anchor="middle" fill="#a29cb2" font-size="8" letter-spacing="2.5">IZUKO TV</text>
  <circle cx="139" cy="273" r="61" fill="#1c1d27"/>
  <circle cx="139" cy="272" r="58" fill="url(#direction-pad)" stroke="#696979" stroke-opacity=".5"/>
  <path d="m100 233 17 17m44 44 17 17m-78 0 17-17m44-44 17-17" stroke="#262734" stroke-opacity=".65"/>
  <circle cx="139" cy="274" r="28" fill="#21212e"/>
  <circle cx="139" cy="272" r="26" fill="url(#confirm-key)" stroke="#f0eaff" stroke-opacity=".6"/>
  <text x="139" y="277" text-anchor="middle" fill="#403256" font-size="13" font-weight="700">确认</text>
  <use href="#up" class="remote-icon" transform="translate(139 230)"/>
  <use href="#down" class="remote-icon" transform="translate(139 314)"/>
  <path class="remote-icon" d="m101 267-5 5 5 5m76-10 5 5-5 5"/>

  <circle cx="108" cy="380" r="23" fill="#171823"/>
  <circle cx="170" cy="380" r="23" fill="#171823"/>
  <circle cx="108" cy="378" r="22" fill="#42424f" stroke="#60606f" stroke-opacity=".5"/>
  <circle cx="170" cy="378" r="22" fill="#42424f" stroke="#60606f" stroke-opacity=".5"/>
  <use href="#back" class="remote-icon" transform="translate(109 377) scale(.85)"/>
  <use href="#play-pause" class="remote-icon" transform="translate(170 378) scale(.8)"/>
  <text class="remote-small" x="108" y="415" text-anchor="middle">返回</text>
  <text class="remote-small" x="170" y="415" text-anchor="middle">播放</text>
  <circle cx="108" cy="457" r="22" fill="#171823"/>
  <circle cx="170" cy="457" r="22" fill="#171823"/>
  <circle cx="108" cy="455" r="21" fill="#383845" stroke="#545361" stroke-opacity=".5"/>
  <circle cx="170" cy="455" r="21" fill="#383845" stroke="#545361" stroke-opacity=".5"/>
  <path d="m107 449-8 6 8 6Zm9 0-8 6 8 6Zm45 0 8 6-8 6Zm9 0 8 6-8 6Z" fill="#d4cddd"/>
  <text class="remote-small" x="108" y="490" text-anchor="middle">快退</text>
  <text class="remote-small" x="170" y="490" text-anchor="middle">快进</text>
  <rect x="125" y="513" width="28" height="2" rx="1" fill="#4c465c"/>
  <text class="footer-text" x="139" y="561" text-anchor="middle">按键位置仅作示意</text>

  <!-- 图标与实体按键对应；每行区分按键、动作和长按行为。 -->
  <g transform="translate(300 142)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#up" class="chip-icon"/></g>
  <text class="label" x="336" y="138">选源面板</text>
  <text class="key-name" x="745" y="137" text-anchor="end">上键</text>
  <text class="detail" x="336" y="160">切换数据源或资源</text>
  <path class="divider" d="M336 177H752"/>

  <g transform="translate(300 206)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><text x="0" y="4" text-anchor="middle" class="key-name">OK</text></g>
  <text class="label" x="336" y="202">播放 / 暂停</text>
  <text class="key-name" x="745" y="201" text-anchor="end">确认键</text>
  <text class="detail" x="336" y="224">按住倍速播放（默认 2.5 倍），松开恢复</text>
  <path class="divider" d="M336 241H752"/>

  <g transform="translate(300 270)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#left-right" class="chip-icon"/></g>
  <text class="label" x="336" y="266">快退 / 快进 5 秒</text>
  <text class="key-name" x="745" y="265" text-anchor="end">左 / 右键</text>
  <text class="detail" x="336" y="288">按住或连按：拖动进度并预览画面</text>
  <text class="detail" x="336" y="308">确认跳转，返回取消</text>
  <path class="divider" d="M336 325H752"/>

  <g transform="translate(300 354)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#down" class="chip-icon"/></g>
  <text class="label" x="336" y="350">进度条与控制按钮</text>
  <text class="key-name" x="745" y="349" text-anchor="end">下键</text>
  <text class="detail" x="336" y="372">显示后，用方向键在按钮之间移动</text>
  <path class="divider" d="M336 389H752"/>

  <g transform="translate(300 418)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#back" class="chip-icon" transform="scale(.8)"/></g>
  <text class="label" x="336" y="414">逐层收起，最后退出播放</text>
  <text class="key-name" x="745" y="413" text-anchor="end">返回键</text>
  <text class="detail" x="336" y="436">长按：收起所有面板，直接回到画面</text>
  <path class="divider" d="M336 453H752"/>

  <g transform="translate(300 482)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#play-pause" class="chip-icon" transform="scale(.8)"/></g>
  <text class="label" x="336" y="478">播放 / 暂停</text>
  <text class="key-name" x="745" y="477" text-anchor="end">播放键</text>
  <text class="detail" x="336" y="500">拖动进度时按下，从预览位置开始播放</text>
  <path class="divider" d="M336 517H752"/>

  <g transform="translate(300 546)"><rect class="chip" x="-20" y="-20" width="40" height="40" rx="13"/><use href="#previous-next" class="chip-icon"/></g>
  <text class="label" x="336" y="542">上一集 / 下一集</text>
  <text class="key-name" x="745" y="541" text-anchor="end">快退 / 快进键</text>
  <text class="detail" x="336" y="564">用遥控器上的独立媒体键切换剧集</text>

  <rect class="footer" x="24" y="596" width="732" height="28" rx="10"/>
  <circle cx="41" cy="610" r="3" fill="#a18acb"/>
  <text class="footer-text" x="53" y="614">左右方向键调进度，独立快退 / 快进键切换剧集。</text>
</svg>
