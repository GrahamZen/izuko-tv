<svg xmlns="http://www.w3.org/2000/svg" width="780" height="634" viewBox="0 0 780 634" fill="none" role="img" aria-labelledby="title description">
  <title id="title">海报浏览与打开方式</title>
  <desc id="description">默认选择先看简介：用方向键在海报墙选中番剧，按一次确认显示背景大图和简介，再按一次确认进入详情页。也可以在设置、主题与色彩、海报上按确定中选择直接播放或直接进详情页。直接播放会接着上次看到的那集播放，没看过则从第一集开始。</desc>
