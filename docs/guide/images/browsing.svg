      <stop stop-color="#9380bc"/><stop offset="1" stop-color="#c7b6d7"/>
    </linearGradient>
    <linearGradient id="landscape-sky" x1="35" y1="0" x2="224" y2="140" gradientUnits="userSpaceOnUse">
