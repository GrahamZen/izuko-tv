  <style>
    text { font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .canvas { fill: #fcfbfe; stroke: #e7e4ee; }
    .heading { fill: #282534; font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
    .eyebrow { fill: #807492; font-size: 10px; font-weight: 600; letter-spacing: 2px; }
    .subheading { fill: #746e80; font-size: 13px; }
    .label { fill: #302b3c; font-size: 17px; font-weight: 600; }
    .detail { fill: #716a7d; font-size: 13px; }
    .step-label { fill: #62516f; font-size: 14px; font-weight: 600; }
    .chip { fill: #eee8fa; }
    .accent { fill: #7860aa; font-size: 12px; font-weight: 600; }
    .step-number { fill: #7860aa; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .connector { stroke: #8c71ae; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .option { fill: #f4f0f9; stroke: #e9e1f1; }
    .divider { stroke: #eae6f0; }
    .footer { fill: #f2eff8; }
    .footer-text { fill: #766b89; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1c1b23; stroke: #37323f; }
      .heading, .label { fill: #eee8f6; }
      .eyebrow { fill: #ac9cbe; }
      .subheading, .detail { fill: #b6acc4; }
      .step-label { fill: #c7b7d8; }
      .chip { fill: #383044; }
      .accent, .step-number { fill: #c6afea; }
      .connector { stroke: #c6afea; }
      .option { fill: #2a2533; stroke: #3a3145; }
      .divider { stroke: #36303f; }
      .footer { fill: #2a2533; }
      .footer-text { fill: #b9accb; }
    }
  </style>

